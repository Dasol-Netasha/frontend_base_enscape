services:
  db:
    image: postgres:16
    container_name: base-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-base_db}
      POSTGRES_USER: ${POSTGRES_USER:-base_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-base_pass}
      TZ: ${TZ:-Asia/Seoul}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C.UTF-8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-base_user} -d ${POSTGRES_DB:-base_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: base-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-base_user}:${POSTGRES_PASSWORD:-base_pass}@db:5432/${POSTGRES_DB:-base_db}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_RELOAD: "false"
      TZ: ${TZ:-Asia/Seoul}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: base-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  postgres_data: